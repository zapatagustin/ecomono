# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Config/Markdown repo — portable Claude Code + opencode agent stack.
  Languages: TypeScript (opencode plugins), Python (skill scripts), Go (nix pkg defs), Shell (installer), Nix (flake).
  Architecture: Single-source-of-truth config tree; symlinked read-only, runtime-mutated files copied.
  No main runtime or application code — this is an agent-config distribution repo.
  Conventions: Ecomono register (terse, direct), conventional commits, lazy-senior-dev build discipline.
  Engram persistent memory active. OpenCode orchestrator + sub-agent SDD pipeline.

testing:
  strict_tdd: false
  runner:
    command: "opencode/plugins/storage/run-tests.sh"
    framework: "none — plain assert scripts run by bun"
  layers:
    unit: { available: true, tool: "bun run opencode/plugins/storage/test_{storage,tools,conflicts,migration}.ts" }
    integration: { available: true, tool: "bun run opencode/plugins/storage/test_mcp.ts" }
    e2e: { available: false, tool: "" }
  coverage:
    available: false
    command: ""
  quality:
    linter: { available: false, command: "" }
    type_checker: { available: false, command: "" }
    formatter: { available: false, command: "" }

rules:
  proposal:
    - Include rollback plan for risky changes
    - Keep proposals under one page; reference DESIGN.md for architectural context
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Reference docs/DESIGN.md for existing architectural decisions
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    rules:
      - Follow existing code patterns
      - Config/symlink changes: verify idempotence
    tdd: false
    test_command: "opencode/plugins/storage/run-tests.sh"
  verify:
    test_command: "opencode/plugins/storage/run-tests.sh"
    build_command: "opencode/plugins/storage/build-bundle.sh"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas